<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfcfc">
  <title>ValMari — Учебный центр эстетической косметологии</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header>
    <div class="container header-top">
      <a href="#/" class="logo">
        <img src="images/logo.jpg" alt="ValMari">
        <span>Учебный центр<br>эстетической косметологии</span>
      </a>

      <div class="contacts">
        <a href="tel:+77275086222" style="display:flex;align-items:center;gap:10px"><img src="images/phone.png" alt="">+7 (727) 508-62-22</a>
        <a class="social-link" href="https://facebook.com/" target="_blank" rel="noopener"><img src="images/fb.png" alt="Facebook"></a>
        <a class="social-link" href="https://instagram.com/" target="_blank" rel="noopener"><img src="images/ig.png" alt="Instagram"></a>

        <span class="language">
          <button class="language-button" aria-haspopup="true" aria-label="Язык">
            <img class="flag" alt=""><b class="language-code">RU</b><i class="language-chevron"></i>
          </button>
          <span class="language-menu">
            <a data-language="ru" class="active"><img data-flag="ru" alt="">Русский<u></u></a>
            <a data-language="kk"><img data-flag="kk" alt="">Қазақша<u></u></a>
            <a data-language="en"><img data-flag="en" alt="">English<u></u></a>
          </span>
        </span>
        <button id="theme-toggle" type="button" aria-label="Сменить тему" title="Сменить тему"></button>
      </div>

      <button id="menu-toggle" aria-label="Меню">☰</button>
    </div>

    <nav class="container" id="nav"></nav>
  </header>

  <main id="page"></main>

  <footer class="map-section">
    <div class="map-frame" id="map-frame">
      <img src="images/map.jpg" alt="Карта">
      <div class="map-buttons">
        <a class="btn" href="https://www.google.com/maps/search/?api=1&query=Алматы,+проспект+Абая+150" target="_blank" rel="noopener">Открыть в Google Maps</a>
        <a class="btn-secondary" href="https://www.google.com/maps/dir/?api=1&destination=Алматы,+проспект+Абая+150" target="_blank" rel="noopener">Построить маршрут</a>
      </div>
    </div>

    <div class="footer-info">
      <a href="#/" class="logo"><img src="images/logo.jpg" alt="ValMari"></a>
      <b>+7 (727) 508-62-22</b>
      <span style="font-size:20px">Алматы, пр. Абая, д. 150</span>
      <div class="footer-links-grid" id="footer-links"></div>
      <div class="contacts">
        <a href="https://facebook.com/" target="_blank" rel="noopener"><img src="images/fbw.png" alt="Facebook"></a>
        <a href="https://instagram.com/" target="_blank" rel="noopener"><img src="images/igw.png" alt="Instagram"></a>
      </div>
      <a href="#/privacy"><small>Политика конфиденциальности</small></a>
    </div>
  </footer>

  <button id="scroll-top" aria-label="Наверх">↑</button>
  <div id="toast"></div>
  <div id="modal">
    <div>
      <button class="modal-close" aria-label="Закрыть">×</button>
      <span id="modal-body"></span>
    </div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
